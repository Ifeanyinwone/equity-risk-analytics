services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rad
      POSTGRES_USER: rad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment before starting Postgres}
    ports: ["5432:5432"]
    volumes: ["rad_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rad -d rad"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rad_pgdata:
